[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arachnepy"
version = "0.1.0"
description = "Tiny neural network library built from scratch"
authors = [
    {name = "Rihaan"}
]
dependencies = [
    "numpy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arachnepy*"]